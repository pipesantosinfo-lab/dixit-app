<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Hero B — Pipe Santos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Playfair+Display:ital,wght@1,500;1,600&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root{
    --morado:#8B3CF7; --lavanda:#C9A7FF; --tinta:#070508;
    --sans:'Montserrat',system-ui,sans-serif;
    --serif:'Playfair Display',Georgia,serif;
    --mono:'DM Mono',ui-monospace,monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:var(--tinta); font-family:var(--sans); overflow-x:clip; }

  .hero{ position:relative; width:100%; height:100dvh; min-height:620px; overflow:hidden; background:var(--tinta); }

  .foto{
    position:absolute; inset:0;
    background:url('/landing-hero-v2.webp') 56% 12% / cover no-repeat;
    animation:zoom 18s ease-out forwards;
  }
  @keyframes zoom{ from{ transform:scale(1.08) } to{ transform:scale(1) } }
  @media (prefers-reduced-motion: reduce){ .foto{ animation:none } }

  .velo{
    position:absolute; inset:0;
    background:linear-gradient(to bottom,
      rgba(7,5,8,.74) 0%, rgba(7,5,8,.12) 24%, rgba(7,5,8,.06) 44%,
      rgba(7,5,8,.74) 72%, rgba(7,5,8,.97) 93%);
  }

  .nav{
    position:absolute; top:calc(env(safe-area-inset-top, 0px) + 18px); left:0; right:0; z-index:30;
    display:flex; align-items:center; justify-content:space-between; padding:0 20px;
  }
  .nav img{ height:26px; width:auto; opacity:.95; }
  .ham{ width:22px; }
  .ham i{ display:block; height:2px; background:#fff; border-radius:2px; margin:5px 0; }
  .ham i:last-child{ width:14px; margin-left:auto; }

  .prog{
    position:absolute; top:calc(env(safe-area-inset-top, 0px) + 60px); left:20px; right:20px;
    z-index:30; display:flex; gap:5px;
  }
  .prog i{ flex:1; height:2.5px; border-radius:2px; background:rgba(255,255,255,.3); overflow:hidden; }
  .prog i.on{ background:rgba(255,255,255,.3); position:relative; }
  .prog i.on::after{
    content:''; position:absolute; inset:0; background:#fff; transform-origin:left;
    animation:llenar 5s linear infinite;
  }
  @keyframes llenar{ from{ transform:scaleX(0) } to{ transform:scaleX(1) } }

  .chip{
    position:absolute; z-index:25; display:inline-flex; align-items:center; gap:7px;
    padding:9px 15px; border-radius:999px; font-size:12.5px; font-weight:700; color:#fff;
    background:rgba(7,5,8,.44); border:1px solid rgba(255,255,255,.2);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    opacity:0; animation:entra .6s ease-out forwards;
  }
  .chip em{ font-style:normal; color:var(--lavanda); font-weight:900; }
  @keyframes entra{ from{ opacity:0; transform:translateY(10px) } to{ opacity:1; transform:none } }
  .c1{ top:19%; right:22px; animation-delay:.5s; }
  .c2{ top:27%; left:22px;  animation-delay:.8s; }
  .c3{ top:36%; right:40px; animation-delay:1.1s; }

  .pie{ position:absolute; left:24px; right:24px; bottom:calc(env(safe-area-inset-bottom, 0px) + 34px); z-index:25; }
  .pie .pre{ font-family:var(--serif); font-style:italic; font-size:24px; color:var(--lavanda); margin:0 0 2px; }
  .pie h1{
    font-size:clamp(32px, 10.4vw, 43px); font-weight:900; line-height:.94;
    letter-spacing:-.03em; color:#fff; text-transform:uppercase; margin:0 0 14px;
  }
  .pie .meta{
    font-family:var(--mono); font-size:10px; letter-spacing:.26em; text-transform:uppercase;
    color:rgba(255,255,255,.6); margin:0 0 18px;
  }
  .cta{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; color:#070508; border-radius:999px; padding:15px 22px;
    font-size:14.5px; font-weight:800; text-decoration:none;
  }
  .cta svg{ width:17px; height:17px; }

  .siguiente{ height:40vh; background:var(--tinta); }
</style>
</head>
<body>
  <section class="hero">
    <div class="foto"></div>
    <div class="velo"></div>

    <div class="nav">
      <img src="/logo.png" alt="Pipe Santos">
      <div class="ham"><i></i><i></i><i></i></div>
    </div>

    <div class="prog"><i class="on"></i><i></i><i></i><i></i></div>

    <span class="chip c1"><em>+1M</em> en redes</span>
    <span class="chip c2"><em>+300</em> escenarios</span>
    <span class="chip c3">🎤 En vivo</span>

    <div class="pie">
      <p class="pre">Historias que</p>
      <h1>Transforman</h1>
      <p class="meta">Pipe Santos · Cartagena, Colombia</p>
      <a class="cta" href="#">
        <span>Conoce mi trabajo</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </a>
    </div>
  </section>
  <div class="siguiente"></div>
</body>
</html>
